apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-native
  labels:
    app: nginx-native
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-native
  template:
    metadata:
      labels:
        app: nginx-native
        k8s-darwin.dev/native: "true"
    spec:
      nodeSelector:
        k8s-darwin.dev/native: "true"
      tolerations:
        - key: k8s-darwin.dev/native
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: nginx
          image: docker.io/initialed85/nginx:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-native
  labels:
    app: nginx-native
spec:
  selector:
    app: nginx-native
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-native
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: nginx.dev.initialed85.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-native
                port:
                  name: http
  tls:
    - hosts:
        - nginx.dev.initialed85.cc
      secretName: nginx-dev-initialed85-cc
